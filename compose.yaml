services:
  api:
    build: backend
    working_dir: /app
    entrypoint: /app/kms-bin
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
  web:
    build: frontend
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    ports:
      - 3001:80
