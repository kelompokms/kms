services:
  api:
    build: backend
    working_dir: /app
    entrypoint: /app/kms-bin
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    ports:
      - 3002:3000
  web:
    build: frontend
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    ports:
      - 3001:80
